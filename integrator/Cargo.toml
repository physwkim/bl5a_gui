# Integrates the mar345 frames bl5a-qs's exposures name, stacks them per
# series in HDF5, and serves the stacks (REP) and each new row (PUB).

[package]
name = "bl5a-integrator"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ad-mar345 = { workspace = true }
clap = { version = "4", features = ["derive"] }
rmp-serde = "1.3"
rsfai = { git = "https://github.com/physwkim/rsFAI", rev = "ea24282d218f4fe191ed296fae7817f7f7d6c362" }
rsfai-calib = { git = "https://github.com/physwkim/rsFAI", rev = "ea24282d218f4fe191ed296fae7817f7f7d6c362" }
rsfai-calibrant = { git = "https://github.com/physwkim/rsFAI", rev = "ea24282d218f4fe191ed296fae7817f7f7d6c362" }
rsfai-core = { git = "https://github.com/physwkim/rsFAI", rev = "ea24282d218f4fe191ed296fae7817f7f7d6c362" }
rsfai-geometry = { git = "https://github.com/physwkim/rsFAI", rev = "ea24282d218f4fe191ed296fae7817f7f7d6c362" }
rust-hdf5 = "0.7.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zmq = "0.10"
